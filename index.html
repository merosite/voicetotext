<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Typing Engine By Lurey Kashyap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h2 {
            color: #1a237e;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 10px;
            font-size: 1.4rem;
        }

        .section {
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        textarea {
            width: 100%;
            height: 320px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.6;
            resize: vertical;
            margin-bottom: 15px;
            outline: none;
            -webkit-appearance: none;
        }

        textarea:focus {
            border-color: #1565c0;
            box-shadow: 0 0 5px rgba(21, 101, 192, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button {
            padding: 12px 18px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #cccccc;
            cursor: pointer;
            font-weight: bold;
        }

        button {
            color: #ffffff;
            transition: all 0.2s ease;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-mic-start { background-color: #2e7d32; }
        .btn-mic-start:hover { background-color: #1b5e20; }

        .btn-mic-stop { background-color: #c62828; }
        .btn-mic-stop:hover { background-color: #b71c1c; }

        .btn-clear { background-color: #616161; }
        .btn-clear:hover { background-color: #424242; }

        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #d32f2f;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        .status-box {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #424242;
            display: flex;
            align-items: center;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="uiTitle">🎙️ Voice Typing Engine By Lurey Kashyap</h2>

    <div class="section">
        <textarea id="sttOutput" placeholder="माइक अन गरेर बोल्नुहोस्..."></textarea>
        
        <div class="controls">
            <label for="langSelect" id="uiLangLabel">भाषा:</label>
            <select id="langSelect" onchange="changeLanguage()">
                <option value="ne-NP" selected>नेपाली (Nepali)</option>
                <option value="en-US">English (English)</option>
            </select>

            <button id="startBtn" class="btn-mic-start" onclick="startRecognition()">🎤 माइक अन गर्नुहोस्</button>
            <button id="stopBtn" class="btn-mic-stop" onclick="stopRecognition()" disabled>🛑 माइक बन्द गर्नुहोस्</button>
            <button id="clearBtn" class="btn-clear" onclick="clearText()">🗑️ Clear Text</button>
        </div>

        <div class="status-box">
            <span id="dot" class="recording-indicator" style="display: none;"></span>
            <span id="sttStatus">माइक निष्क्रिय छ।</span>
        </div>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    // UI Elements
    const uiTitle = document.getElementById('uiTitle');
    const uiLangLabel = document.getElementById('uiLangLabel');
    const sttOutput = document.getElementById('sttOutput');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const sttStatus = document.getElementById('sttStatus');
    const dot = document.getElementById('dot');
    const langSelect = document.getElementById('langSelect');

    let recognition = null;
    let isUserStopped = false; 
    let committedText = ''; 

    // Dynamic UI Translation Dictionary
    const translations = {
        'ne-NP': {
            title: "🎙️ Voice Typing Engine By Lurey Kashyap",
            placeholder: "माइक अन गरेर बोल्नुहोस्...",
            langLabel: "भाषा:",
            startBtn: "🎤 माइक अन गर्नुहोस्",
            stopBtn: "🛑 माइक बन्द गर्नुहोस्",
            clearBtn: "🗑️ Clear Text",
            statusInactive: "माइक निष्क्रिय छ।",
            statusListening: "सुन्दैछ... कृपया बोल्नुहोस्।",
            statusPermissionErr: "त्रुटि: माइक्रोनको अनुमति (Microphone Permission) दिनुहोस्।",
            statusUnsupported: "तपाईँको ब्राउजरमा Voice Typing सपोर्ट छैन।"
        },
        'en-US': {
            title: "🎙️ Voice Typing Engine By Lurey Kashyap",
            placeholder: "Turn on the mic and speak...",
            langLabel: "Language:",
            startBtn: "🎤 Turn On Mic",
            stopBtn: "🛑 Turn Off Mic",
            clearBtn: "🗑️ Clear Text",
            statusInactive: "Microphone is inactive.",
            statusListening: "Listening... Please speak.",
            statusPermissionErr: "Error: Please allow microphone permission.",
            statusUnsupported: "Voice Typing is not supported in your browser."
        }
    };

    // १ देखि १०० सम्मका अङ्क र शुद्ध नेपाली शब्द म्यापिङ
    const numToWordMap = {
        '०':'शून्य', '१':'एक', '२':'दुई', '३':'तीन', '४':'चार', '५':'पाँच', '६':'छ', '७':'सात', '८':'आठ', '९':'नौ',
        '१०':'दस', '११':'एघार', '१२':'बाह्र', '१३':'तेह्र', '१४':'चौध', '१५':'पन्ध्र', '१६':'सोह्र', '१७':'सत्र', '१८':'अठार', '१९':'उन्नाइस',
        '२०':'बीस', '२१':'एक्याइस', '२२':'बाइस', '२३':'तेइस', '२४':'चौबीस', '२५':'पच्चीस', '२६':'छब्बीस', '२७':'सत्ताइस', '२८':'अत्ठाइस', '२९':'उन्तीस',
        '३०':'तीस', '३१':'एकतीस', '३२':'बत्तीस', '३३':'तेत्तीस', '३४':'चौँतीस', '३५':'पैँतीस', '३६':'छत्तीस', '३७':'सैँतीस', '३८':'अधँतीस', '३९':'उन्चालिस',
        '४०':'चालिस', '४१':'एकचालिस', '४२':'बयालिस', '४३':'त्रिचालिस', '४४':'चौवालिस', '४५':'पैँतालीस', '४६':'छयालिस', '४७':'सत्चालिस', '४८':'अठचालिस', '४९':'उन्चास',
        '५०':'पचास', '५१':'एकान्न', '५२':'बाउन्न', '५३':'त्रिपन्न', '५४':'चौवन', '५५':'पचपन्न', '५६':'छप्पन्न', '५७':'सन्ताउन्न', '५८':'अन्ठाउन्न', '५९':'उन्सार',
        '६०':'साठी', '६१':'एकसट्ठी', '६२':'बायसट्ठी', '६३':'त्रिलीसट्ठी', '६४':'चौँसट्ठी', '६५':'पैँसट्ठी', '६६':'छ्यासट्ठी', '६७':'सड्सट्ठी', '६८':'अड्सट्ठी', '६९':'उनान्सी',
        '७०':'सत्तरी', '७१':'एकहत्तर', '७२':'बहत्तर', '७३':'त्रिहत्तर', '७४':'चौहत्तर', '७५':'पचहत्तर', '७६':'छ्याहत्तर', '७७':'सतहत्तर', '७८':'अठहत्तर', '७९':'उनासी',
        '८०':'असी', '८१':'एकासी', '८२':'बयासी', '८३':'त्रियासी', '८४':'चौरासी', '८५':'पचासी', '८६':'छयासी', '८७':'सत्तासी', '८८':'अठासी', '८९':'उनान्नब्बे',
        '९०':'नब्बे', '९१':'एकान्नब्बे', '९२':'बयानब्बे', '९३':'त्रियान्नब्बे', '९४':'चौरान्नब्बे', '९५':'पञ्चान्नब्बे', '९६':'छयान्नब्बे', '९७':'सन्तान्नब्बे', '९८':'अन्ठान्नब्बे', '९९':'उनान्सय',
        '१००':'सय'
    };

    const wordToNumMap = {};
    for (let key in numToWordMap) {
        wordToNumMap[numToWordMap[key]] = key;
    }
    wordToNumMap['दश'] = '१०'; wordToNumMap['दस'] = '१०';
    wordToNumMap['दुइ'] = '२'; wordToNumMap['एघार'] = '११';

    const englishDigitMap = {'0':'०', '1':'१', '2':'२', '3':'३', '4':'४', '5':'५', '6':'६', '7':'७', '8':'८', '9':'९'};

    function convertEnglishDigitsToNepali(str) {
        return str.replace(/[0-9]/g, function(w) {
            return englishDigitMap[w] || w;
        });
    }

    function formatEnglishText(text, isFinal) {
        if (!text) return '';
        text = text.replace(/[\u0900-\u097F]/g, '');
        text = text.replace(/(^\s*|[.?!]\s+)([a-z])/g, function(match, p1, p2) {
            return p1 + p2.toUpperCase();
        });
        text = text.replace(/\bi\b/g, 'I');
        text = text.replace(/\s+([,.?!])/g, '$1');
        text = text.replace(/\s+/g, ' ').trim();

        if (isFinal && text.length > 0 && !/[.?!]$/.test(text)) {
            text += '.';
        }
        return text;
    }

    function processTextByLanguage(text, lang, isFinal) {
        if (!text) return '';

        if (lang === 'ne-NP') {
            text = text.replace(/[a-zA-Z]/g, '');
            text = convertEnglishDigitsToNepali(text);
            text = text.replace(/कार्यान्व्यन/g, 'कार्यान्वयन');

            text = text.replace(/([०-९]+)\s+(दश|दस|[०-९]+)/g, function(match, num) {
                return num;
            });

            text = text.replace(/([०-९]+)/g, function(match) {
                if (numToWordMap[match]) {
                    return match + ' (' + numToWordMap[match] + ')';
                }
                return match;
            });

            for (let word in wordToNumMap) {
                let num = wordToNumMap[word];
                let wordInParen = numToWordMap[num] || word;
                let regex = new RegExp('(?:^|\\s)' + word + '(?:$|\\s)', 'g');
                text = text.replace(regex, ' ' + num + ' (' + wordInParen + ') ');
            }

            text = text.replace(/\s+/g, ' ').trim();

            if (isFinal && text.length > 0 && !text.endsWith('।')) {
                text += '।';
            }

            return text;
        } else if (lang === 'en-US') {
            return formatEnglishText(text, isFinal);
        }

        return text;
    }

    function syncCommittedText() {
        committedText = sttOutput.value.trim();
        if (committedText.length > 0) {
            committedText += ' ';
        }
    }

    function updateUIInterface(lang) {
        const t = translations[lang] || translations['ne-NP'];
        uiTitle.textContent = t.title;
        sttOutput.placeholder = t.placeholder;
        uiLangLabel.textContent = t.langLabel;
        startBtn.textContent = t.startBtn;
        stopBtn.textContent = t.stopBtn;
        clearBtn.textContent = t.clearBtn;
        if (!startBtn.disabled) {
            sttStatus.textContent = t.statusInactive;
        }
    }

    function initRecognition() {
        if (!SpeechRecognition) {
            const currentLang = langSelect.value;
            sttStatus.textContent = translations[currentLang].statusUnsupported;
            startBtn.disabled = true;
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;     
        recognition.interimResults = true; 
        recognition.lang = langSelect.value;

        recognition.onstart = () => {
            const currentLang = langSelect.value;
            sttStatus.textContent = translations[currentLang].statusListening;
            dot.style.display = 'inline-block';
            startBtn.disabled = true;
            stopBtn.disabled = false;
        };

        recognition.onresult = (event) => {
            let sessionFinal = '';
            let sessionInterim = '';
            const currentLang = langSelect.value;

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                let isFinal = event.results[i].isFinal;
                let cleanChunk = processTextByLanguage(event.results[i][0].transcript, currentLang, isFinal);
                
                if (cleanChunk) {
                    if (isFinal) {
                        sessionFinal += cleanChunk + ' ';
                    } else {
                        sessionInterim += cleanChunk + ' ';
                    }
                }
            }

            if (sessionFinal.length > 0) {
                committedText = (committedText + sessionFinal).replace(/\s+/g, ' ');
            }

            let fullDisplay = (committedText + sessionInterim).replace(/\s+/g, ' ');
            sttOutput.value = fullDisplay;
            sttOutput.scrollTop = sttOutput.scrollHeight;
        };

        recognition.onerror = (event) => {
            const currentLang = langSelect.value;
            if (event.error === 'not-allowed') {
                sttStatus.textContent = translations[currentLang].statusPermissionErr;
                isUserStopped = true;
            } else if (event.error !== 'no-speech') {
                sttStatus.textContent = "Error: " + event.error;
            }
        };

        recognition.onend = () => {
            syncCommittedText();

            if (!isUserStopped) {
                setTimeout(() => {
                    try {
                        recognition.start();
                    } catch (e) {
                        // Continuous auto restart engine
                    }
                }, 150);
            } else {
                const currentLang = langSelect.value;
                sttStatus.textContent = translations[currentLang].statusInactive;
                dot.style.display = 'none';
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        };
    }

    function startRecognition() {
        if (!recognition) {
            initRecognition();
        }
        if (!recognition) return;
        
        syncCommittedText();
        isUserStopped = false;
        recognition.lang = langSelect.value;

        try {
            recognition.start();
        } catch (e) {
            initRecognition();
            recognition.start();
        }
    }

    function stopRecognition() {
        if (!recognition) return;
        isUserStopped = true;
        syncCommittedText();
        recognition.stop();
    }

    function changeLanguage() {
        const selectedLang = langSelect.value;
        updateUIInterface(selectedLang);
        syncCommittedText();

        if (recognition) {
            recognition.lang = selectedLang;
            if (!isUserStopped && startBtn.disabled) {
                stopRecognition();
                setTimeout(() => { startRecognition(); }, 400);
            }
        }
    }

    function clearText() {
        sttOutput.value = '';
        committedText = '';
    }

    sttOutput.addEventListener('input', () => {
        syncCommittedText();
    });

    initRecognition();
</script>

</body>
</html>
